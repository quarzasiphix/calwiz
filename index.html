<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calwiz — Moon, sky and numbers for every day</title>
    <meta name="description" content="A private, offline-capable cosmic calendar: accurate Moon phases and illumination, real planetary positions and retrogrades, symbolic astrology and Pythagorean numerology." />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calwiz" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Calwiz — Cosmic Calendar" />
    <meta property="og:description" content="The Moon, the planets and the numbers of every day. Real astronomical calculations, symbolic astrology and numerology." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem("calwiz:profile:v1") || "null");
        if (p && (p.theme === "dark" || p.theme === "light")) document.documentElement.setAttribute("data-theme", p.theme);
      } catch (e) {}
    </script>
    <style>
      html { background: #0b0d17; }
      @media (prefers-color-scheme: light) { html:not([data-theme]) { background: #f6f2e9; } }
      html[data-theme="light"] { background: #f6f2e9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Calwiz needs JavaScript: every calculation runs on your device.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
